[tool.poetry]
name = "voltaire_bundler"
version = "v3.0.11"
description = "EIP-4337 python Bundler"
authors = ["Candide Wallet Team"]
license = "LGPL"
readme = "README.md"
homepage = "https://github.com/candidelabs/voltaire"
repository = "https://github.com/candidelabs/voltaire"
keywords = ["4337", "account_abstraction", "ethereum", "bundler"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Library or Lesser General Public License (LGPL)",
]

[tool.poetry.dependencies]
python = "^3.13.2"
uvloop = {version = "^0.23.0", markers = "sys_platform != 'win32'"}
eth-abi = "^5.2.0"
eth-account = "^0.13.5"
prometheus-client = "^0.21.1"
aiohttp-cors = "^0.8.1"
aiohttp = "^3.14.5"
# Transitive dependencies held at patched floors (security fixes).
# poetry.lock and requirements.txt are generated from this file.
multidict = "^7.2.0"
idna = "^3.20"
asyncpg = "^0.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1"
docker = "^7.1.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.scripts]
export_requirements = "scripts.export_requirements:export"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
